seeds:
  - name: leagues
    description: >
      The leagues downloaded and modeled; tier within the country (1 = top), and
      the matches a full season has.
    columns:
      - name: league
        data_tests: [unique, not_null]

  - name: bookmakers
    description: Football-Data bookmaker codes.
    columns:
      - name: code
        data_tests: [unique, not_null]
      - name: licensed_de
        description: on the GGL whitelist of licensed German operators

  - name: bookmaker_unreliable_periods
    description: Bookmakers whose odds the source flags as unreliable from a match date on.
    config:
      column_types:
        unreliable_from: date
    columns:
      - name: code
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('bookmakers')
                field: code

  - name: football_data_files
    description: >
      The data version: sha256 and size of each stored Football-Data CSV, written
      by scripts/download_football_data.py. Committed, so a diff after a download
      shows which files changed.
    config:
      column_types:
        league: varchar
        season: varchar
        sha256: varchar
        bytes: bigint

  - name: understat_files
    description: >
      The Understat data version: sha256 and size of each stored JSON file,
      written by scripts/download_understat.py.
    config:
      column_types:
        league: varchar
        season: varchar
        sha256: varchar
        bytes: bigint

  - name: understat_team_names
    description: Understat team name to Football-Data team name, per league.
    columns:
      - name: understat_name
        data_tests: [not_null]
      - name: football_data_name
        data_tests: [not_null]

  - name: international_results_files
    description: >
      The martj42/international_results data version: sha256 and size of each
      stored CSV, written by scripts/download_international_results.py (commit
      pinned there).
    config:
      column_types:
        file: varchar
        sha256: varchar
        bytes: bigint

  - name: eloratings_files
    description: >
      The eloratings.net data version: sha256 and size of each stored .tsv file,
      written by scripts/download_eloratings.py.
    config:
      column_types:
        file: varchar
        sha256: varchar
        bytes: bigint

