models:
  - name: int_matches
    description: One row per match with the times its data becomes known; see the model for the rules.
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: pre_at
        description: when the pre odds become known; the `pre` prediction time
        data_tests: [not_null]
      - name: close_at
        description: kickoff, or end of match day before 2019/20; the `close` prediction time
        data_tests: [not_null]
      - name: result_at
        description: end of match day; when the result counts as known
        data_tests: [not_null]
      - name: pre_timing_uncertain
        description: match from 20 Dec to 5 Jan, where pre_at may be too early
        data_tests: [not_null]
      - name: home_rest_days
        description: >
          days since the team's previous league match (any season, so the first
          match of a season counts the summer break); null for its first match in the files
      - name: home_matches_14d
        description: the team's league matches in the 14 days before this one
        data_tests: [not_null]
      - name: away_matches_14d
        data_tests: [not_null]

  - name: int_odds
    description: Odds with available_at and margin-free probabilities (normalized 1/odds).
    columns:
      - name: available_at
        description: when the odds became known; see the model for the rule
        data_tests: [not_null]
      - name: pre_timing_uncertain
        description: pre odds in the 20 Dec to 5 Jan window, where available_at may be too early
        data_tests: [not_null]
      - name: is_reliable
        description: false where the source flags the bookmaker's odds as unreliable
        data_tests: [not_null]
      - name: overround
        description: sum of 1/odds; 1.05 = 5% margin
