models:
  - name: base_football_data
    description: Every Football-Data CSV row as text, unioned by column name.

  - name: stg_football_data__matches
    description: One row per match, leagues in seeds/leagues.csv, from Football-Data.
    columns:
      - name: match_id
        description: league, date and home team; a team plays at most once a day
        data_tests: [unique, not_null]
      - name: league
        data_tests:
          - relationships:
              arguments:
                to: ref('leagues')
                field: league
      - name: season
        description: "four digits, 2526 = 2025/26"
        data_tests: [not_null]
      - name: match_date
        data_tests: [not_null]
      - name: kickoff_time
        description: UK local time, as given by Football-Data; null before 2019/20
      - name: kickoff_at
        description: kickoff_time as a timestamp with time zone; null before 2019/20
      - name: home_team
        data_tests: [not_null]
      - name: away_team
        data_tests: [not_null]
      - name: home_goals
        data_tests: [not_null]
      - name: away_goals
        data_tests: [not_null]
      - name: result
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [H, D, A]
      - name: home_shots
        description: shots, including those on target; seasons that carry them in tests/shots_coverage.sql
      - name: away_shots
      - name: home_shots_on_target
      - name: away_shots_on_target

  - name: stg_football_data__odds
    description: 1X2 odds, one row per match, bookmaker and moment.
    columns:
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football_data__matches')
                field: match_id
      - name: bookmaker
        data_tests:
          - relationships:
              arguments:
                to: ref('bookmakers')
                field: code
      - name: moment
        description: pre (Football-Data snapshot) or close
        data_tests:
          - accepted_values:
              arguments:
                values: [pre, close]

  - name: stg_understat__matches
    description: One row per Understat match (2014/15 onward), team names mapped to Football-Data's.
    columns:
      - name: understat_id
        data_tests: [unique, not_null]
      - name: home_team
        description: null if the Understat name is missing from seeds/understat_team_names.csv
        data_tests: [not_null]
      - name: away_team
        data_tests: [not_null]
      - name: is_result
        description: false for matches not yet played

  - name: stg_international_results__matches
    description: >
      One row per match from martj42/international_results, with the
      90-minute score derived from goalscorers.csv.
    columns:
      - name: match_id
        description: date, home and away team (martj42 names), and a count for a second match that day
        data_tests: [unique, not_null]
      - name: home_team_id
        description: from seeds/team_names.csv; null for teams eloratings.net does not rate
      - name: home_score
        description: full time, extra time included, shootout excluded
        data_tests: [not_null]
      - name: away_score
        data_tests: [not_null]
      - name: home_score_90
        description: goals at minute 90 or before (stoppage included); null unless score_90_reliable
      - name: goals_complete
        description: goalscorers.csv lists every goal of the match, each with a minute
      - name: after_90
        description: listed goals after minute 90
      - name: awarded
        description: in seeds/international_awarded_matches.csv; the score is a ruling, not a result
        data_tests: [not_null]
      - name: score_90_reliable
        description: >
          goals_complete, not awarded, and (outside WC and EURO finals) no goal
          after minute 90; see tests/score_90_only_where_reliable.sql
        data_tests: [not_null]
      - name: finals
        description: WC or EURO for finals matches, else null
      - name: edition
        description: year of the finals (EURO 2020 played in 2021); null outside finals

  - name: stg_eloratings__matches
    description: >
      One row per match from the eloratings.net yearly results files, codes
      mapped to team ids, with pre- and post-match ratings.
    columns:
      - name: match_date
        description: null for one 2004 match with an unknown day
      - name: code1
        description: current eloratings.net code of the first team (home unless venue says otherwise)
        data_tests: [not_null]
      - name: venue
        description: code of the country played in; null when team 1 played at home
      - name: change
        description: rating points team 1 gained; team 2 lost the same
        data_tests: [not_null]
