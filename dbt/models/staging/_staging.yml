models:
  - name: stg_football_data__matches
    description: One row per match, E0 and D1, from Football-Data.
    columns:
      - name: match_id
        description: league, date and home team; a team plays at most once a day
        data_tests: [unique, not_null]
      - name: league
        data_tests:
          - accepted_values:
              arguments:
                values: [E0, D1]
      - name: season
        description: "four digits, 2526 = 2025/26"
        data_tests: [not_null]
      - name: match_date
        data_tests: [not_null]
      - name: kickoff_time
        description: as given by Football-Data (likely UK time, unverified); null before 2019/20
      - name: home_team
        data_tests: [not_null]
      - name: away_team
        data_tests: [not_null]
      - name: home_goals
        data_tests: [not_null]
      - name: away_goals
        data_tests: [not_null]
      - name: result
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [H, D, A]
