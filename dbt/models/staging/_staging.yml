models:
  - name: base_football_data
    description: Every Football-Data CSV row as text, unioned by column name.

  - name: stg_football_data__matches
    description: One row per match, leagues in seeds/leagues.csv, from Football-Data.
    columns:
      - name: match_id
        description: league, date and home team; a team plays at most once a day
        data_tests: [unique, not_null]
      - name: league
        data_tests:
          - relationships:
              arguments:
                to: ref('leagues')
                field: league
      - name: season
        description: "four digits, 2526 = 2025/26"
        data_tests: [not_null]
      - name: match_date
        data_tests: [not_null]
      - name: kickoff_time
        description: UK local time, as given by Football-Data; null before 2019/20
      - name: kickoff_at
        description: kickoff_time as a timestamp with time zone; null before 2019/20
      - name: home_team
        data_tests: [not_null]
      - name: away_team
        data_tests: [not_null]
      - name: home_goals
        data_tests: [not_null]
      - name: away_goals
        data_tests: [not_null]
      - name: result
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [H, D, A]
      - name: home_shots
        description: shots, including those on target; seasons that carry them in tests/shots_coverage.sql
      - name: away_shots
      - name: home_shots_on_target
      - name: away_shots_on_target

  - name: stg_football_data__odds
    description: 1X2 odds, one row per match, bookmaker and moment.
    columns:
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football_data__matches')
                field: match_id
      - name: bookmaker
        data_tests:
          - relationships:
              arguments:
                to: ref('bookmakers')
                field: code
      - name: moment
        description: pre (Football-Data snapshot) or close
        data_tests:
          - accepted_values:
              arguments:
                values: [pre, close]

  - name: stg_understat__matches
    description: One row per Understat match (2014/15 onward), team names mapped to Football-Data's.
    columns:
      - name: understat_id
        data_tests: [unique, not_null]
      - name: home_team
        description: null if the Understat name is missing from seeds/understat_team_names.csv
        data_tests: [not_null]
      - name: away_team
        data_tests: [not_null]
      - name: is_result
        description: false for matches not yet played
