name: football_forecasting
version: "0.1.0"
profile: football_forecasting

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

vars:
  raw_dir: ../data/raw
  # Column prefixes in the Football-Data CSVs; names and flags in seeds/bookmakers.csv.
  football_data_bookmakers: [1XB, B365, BF, BFD, BFE, BMGM, BS, BV, BW, CL, GB, IW, LB, PP, PS, SB, SJ, SKB, SO, SY, VC, WH, Avg, Max, BbAv, BbMx]

models:
  football_forecasting:
    staging:
      +materialized: table  # a view would resolve the relative CSV path from wherever it is queried
    intermediate:
      +materialized: table
