# mise.toml: toolchain pins and task definitions

[tools]
python    = "3.13.13"
uv        = "0.11.6"
lefthook  = "2.1.6"
cocogitto = "7.0.0"

# ─── Bootstrap ──────────────────────────────────────────────────────────────

[tasks.install]
description = "Install git hooks and dependencies"
run = [
  "lefthook install",
  "uv sync",
]

# ─── Data ───────────────────────────────────────────────────────────────────

[tasks."data:download"]
description = "Download Football-Data CSVs (E0, D1) into data/raw/"
run = "uv run scripts/download_football_data.py"

[tasks."dbt:build"]
description = "Build and test the dbt models into data/warehouse.duckdb"
dir = "{{config_root}}/dbt"
run = "uv run dbt build --profiles-dir ."

# ─── Backtest ───────────────────────────────────────────────────────────────

[tasks.backtest]
description = "Run the walk-forward backtest, store predictions, print scores"
run = [
  "uv run python -m football_forecasting.backtest",
  "uv run python -m football_forecasting.market_aware",
]

[tasks.dashboard]
description = "Serve the backtest dashboard on localhost:8501"
run = "uv run streamlit run src/football_forecasting/dashboard.py --server.address 127.0.0.1 --server.headless true"

[tasks."dashboard:deploy"]
description = "Build and (re)start the dashboard container behind Caddy"
run = "docker compose up -d --build"

# ─── Testing ────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run tests"
run = "uv run pytest"

# ─── Commits ────────────────────────────────────────────────────────────────

[tasks.check-commits]
description = "Verify commits since origin/master are conventional"
run = "cog check origin/master..HEAD"

# ─── Lint & format ──────────────────────────────────────────────────────────

[tasks.lint]
description = "Lint, format-check and type-check"
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run ty check",
]

[tasks.fmt]
description = "Auto-format"
run = "uv run ruff format"
