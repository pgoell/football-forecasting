# mise.toml: toolchain pins and task definitions

[tools]
python    = "3.13"
uv        = "latest"
lefthook  = "latest"
cocogitto = "latest"

# ─── Bootstrap ──────────────────────────────────────────────────────────────

[tasks.install]
description = "Install git hooks and dependencies"
run = [
  "lefthook install",
  "uv sync",
]

# ─── Data ───────────────────────────────────────────────────────────────────

[tasks."data:download"]
description = "Download Football-Data CSVs (E0, D1) into data/raw/"
run = "uv run scripts/download_football_data.py"

[tasks."dbt:build"]
description = "Build and test the dbt models into data/warehouse.duckdb"
dir = "{{config_root}}/dbt"
run = "uv run dbt build --profiles-dir ."

# ─── Testing ────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run tests"
run = "uv run pytest"

# ─── Commits ────────────────────────────────────────────────────────────────

[tasks.check-commits]
description = "Verify commits since origin/master are conventional"
run = "cog check origin/master..HEAD"

# ─── Lint & format ──────────────────────────────────────────────────────────

[tasks.lint]
description = "Lint, format-check and type-check"
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run ty check",
]

[tasks.fmt]
description = "Auto-format"
run = "uv run ruff format"
