# mise.toml: toolchain pins and task definitions

[tools]
python   = "3.13"
uv       = "latest"
lefthook = "latest"

# ─── Bootstrap ──────────────────────────────────────────────────────────────

[tasks.install]
description = "Install git hooks and dependencies"
run = [
  "lefthook install",
  "uv sync",
]

# ─── Testing ────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run tests"
run = "uv run pytest"

# ─── Lint & format ──────────────────────────────────────────────────────────

[tasks.lint]
description = "Lint, format-check and type-check"
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run ty check",
]

[tasks.fmt]
description = "Auto-format"
run = "uv run ruff format"
