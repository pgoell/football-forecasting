# mise.toml: toolchain pins and task definitions

[tools]
python    = "3.13.13"
uv        = "0.11.6"
lefthook  = "2.1.6"
cocogitto = "7.0.0"

# ─── Bootstrap ──────────────────────────────────────────────────────────────

[tasks.install]
description = "Install git hooks and dependencies"
run = [
  "lefthook install",
  "uv sync",
]

# ─── Data ───────────────────────────────────────────────────────────────────

[tasks."data:download"]
description = "Download Football-Data CSVs (dbt/seeds/leagues.csv) into data/raw/"
run = "uv run scripts/download_football_data.py"

[tasks."data:download:understat"]
description = "Download Understat xG (EPL, Bundesliga) into data/raw/"
run = "uv run scripts/download_understat.py"

[tasks."data:download:international-results"]
description = "Download martj42/international_results (pinned commit) into data/raw/"
run = "uv run scripts/download_international_results.py"

[tasks."data:download:eloratings"]
description = "Download eloratings.net results files (2004 to 2026) into data/raw/"
run = "uv run scripts/download_eloratings.py"

[tasks."dbt:build"]
description = "Build and test the dbt models into data/warehouse.duckdb"
dir = "{{config_root}}/dbt"
run = "uv run dbt build --profiles-dir ."

# ─── Backtest ───────────────────────────────────────────────────────────────

[tasks.backtest]
description = "Run the walk-forward backtest, store predictions, print scores"
run = [
  "uv run python -m football_forecasting.backtest",
  "uv run python -m football_forecasting.market_aware",
]

[tasks."national-elo:backtest"]
description = "Development-only national-elo-v1 backtest (docs/tournament-spec.md); validation and the holdout are never touched"
run = "uv run python -m football_forecasting.national_elo_backtest"

[tasks."tournament:forecast"]
description = "Forecast EURO 2020, WC 2022 and EURO 2024 with national-elo-v1, eloratings-v1 and naive-tournament-v1, store results (docs/tournament-spec.md)"
run = "uv run python -m football_forecasting.tournament_run"

[tasks."tournament:validate"]
description = "Score national-elo-v1 on validation (EURO 2020, WC 2022, EURO 2024): match and rounds metrics, bootstrap CIs, success criteria as they read on validation. Run tournament:forecast first. Never touches the holdout (docs/tournament-spec.md)"
run = "uv run python -m football_forecasting.tournament_validation"

[tasks."tournament:holdout"]
description = "HOLDOUT RUN, once: forecast and score national-elo-v1 on WC 2026 (104 finals matches), match and rounds metrics, bootstrap CIs, the real success criteria (docs/tournament-spec.md)"
run = "uv run python -m football_forecasting.tournament_holdout"

[tasks."euro2028:refresh"]
description = "Re-download martj42 and eloratings.net, rebuild dbt, log a fresh EURO 2028 ratings snapshot. eloratings.net rewrites past years too (docs/data-sources.md, eloratings.net): after this, check `git diff dbt/seeds/eloratings_files.csv` and either restore data/raw/eloratings or commit the new record with a docs/experiment-log.md entry before trusting a changed forecast"
run = [
  "uv run scripts/download_international_results.py",
  "uv run scripts/download_eloratings.py --last \"$(date +%Y)\"",
  "mise run dbt:build",
  "uv run python -m football_forecasting.euro2028",
]

[tasks.dashboard]
description = "Serve the backtest dashboard on localhost:8501"
run = "uv run streamlit run src/football_forecasting/dashboard.py --server.address 127.0.0.1 --server.headless true"

[tasks."dashboard:deploy"]
description = "Build and (re)start the dashboard container behind Caddy"
run = "docker compose up -d --build"

# ─── Testing ────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run tests"
run = "uv run pytest"

# ─── Commits ────────────────────────────────────────────────────────────────

[tasks.check-commits]
description = "Verify commits since origin/master are conventional"
run = "cog check origin/master..HEAD"

# ─── Lint & format ──────────────────────────────────────────────────────────

[tasks.lint]
description = "Lint, format-check and type-check"
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run ty check",
]

[tasks.fmt]
description = "Auto-format"
run = "uv run ruff format"
