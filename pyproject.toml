[project]
name = "football-forecasting"
version = "0.1.0"
description = "Statistical football forecasts, tested against the betting market."
readme = "README.md"
authors = [
    { name = "pgoell", email = "pascal98kraus@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
# One-off research scripts, kept as they ran.
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["research"]
