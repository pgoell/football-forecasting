pre-commit:
  parallel: true
  skip: [merge, rebase]
  jobs:
    - name: format
      glob: "*.py"
      run: uv run ruff format --force-exclude {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.py"
      run: uv run ruff check --force-exclude {staged_files}

commit-msg:
  jobs:
    - name: conventional-commit
      run: mise exec -- cog verify --file {1}

pre-push:
  jobs:
    - name: lint
      run: mise run lint
    - name: test
      run: mise run test
    - name: check-commits
      run: mise run check-commits
