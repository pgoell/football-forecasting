pre-commit:
  parallel: true
  skip: [merge, rebase]
  jobs:
    - name: format
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.py"
      run: uv run ruff check {staged_files}

pre-push:
  jobs:
    - name: lint
      run: mise run lint
    - name: test
      run: mise run test
